<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="اكتشف خدمات رقمية مستقلة يمكنك تقديمها"><title>Gig.is</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&family=Montserrat:wght@700&display=swap" rel="stylesheet"><style>
:root{font-family:Tajawal,Arial,sans-serif;color:#242b28;background:#fff}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #eee;padding:23px max(22px,calc((100vw - 880px)/2))}.logo{font:700 26px Montserrat,Arial;direction:ltr;display:inline-block}main{max-width:880px;margin:72px auto;padding:0 22px}h1{font-size:31px;font-weight:700;margin:0 0 42px}h2{font-size:20px;margin:0}label{display:block;font-size:14px;font-weight:700;margin:0 0 10px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:20px}.choices{display:flex;gap:8px}.choices button,select,.primary,.more,.detail{font:inherit;border-radius:8px;cursor:pointer}.choices button{flex:1;background:#fff;border:1px solid #ddd;padding:12px 8px}.choices button.active{border-color:#365b4d;background:#f3f8f5;color:#244638}select{width:100%;border:1px solid #ddd;background:white;padding:13px}.primary{margin-top:24px;border:0;background:#315d4b;color:white;padding:14px 30px;min-width:185px;font-weight:700}.primary:hover{background:#244838}.results{margin-top:55px}.results-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding-bottom:15px}.count{color:#888;font-size:13px}.cards{display:grid;gap:12px;margin-top:16px}.card{border:1px solid #e8e8e8;border-radius:12px;padding:20px}.card-top{display:flex;align-items:center;justify-content:space-between;gap:15px}.card h3{margin:0 0 6px;font-size:18px}.card p{margin:0;color:#777;font-size:14px}.detail,.more{border:1px solid #e1e1e1;background:#fff;padding:9px 14px;color:#355847}.more{margin-top:16px}.extra{border-top:1px solid #eee;margin-top:16px;padding-top:16px;font-size:14px;line-height:1.9}.extra strong{display:block;margin-top:8px}.tools{display:flex;flex-wrap:wrap;gap:8px}.tools a{color:#315d4b;text-decoration:none;border:1px solid #e2e9e5;padding:5px 10px;border-radius:6px}.empty{color:#777;padding:20px 0}footer{max-width:880px;margin:85px auto 20px;padding:20px 22px;color:#aaa;border-top:1px solid #eee;font-size:13px}@media(max-width:640px){main{margin-top:48px}h1{font-size:25px;margin-bottom:32px}.fields{grid-template-columns:1fr}.card{padding:16px}.card-top{align-items:flex-start}}
</style></head><body><header><span class="logo">gig.is</span></header><main><h1>اكتشف خدمة رقمية يمكنك تقديمها</h1><div class="fields"><div><label>مستوى الخبرة</label><div class="choices" id="levels"><button class="active" data-level="0" type="button">مبتدئ</button><button data-level="1" type="button">متوسط</button><button data-level="2" type="button">متقدم</button></div></div><div><label for="category">المجال التقني</label><select id="category"><option value="all">جميع المجالات</option><option value="web">المواقع والتطبيقات</option><option value="design">التصميم الرقمي</option><option value="automation">الأتمتة</option><option value="data">البيانات</option><option value="content">المحتوى الرقمي</option></select></div></div><button id="search" class="primary">اكتشف الخدمات</button><section class="results" id="results" hidden><div class="results-head"><h2>الخدمات المطابقة</h2><span class="count" id="count"></span></div><div class="cards" id="cards"></div><button class="more" id="more" hidden>عرض المزيد</button></section></main><footer>gig.is</footer><script>
let services=[],level=0,filtered=[],visible=3;const $=id=>document.getElementById(id);
document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>{level=Number(b.dataset.level);document.querySelectorAll('[data-level]').forEach(x=>x.classList.toggle('active',x===b));}));
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function render(){const cards=$('cards');cards.replaceChildren();$('count').textContent=filtered.length+' نتائج';if(!filtered.length)cards.append(el('p','empty','لا توجد خدمات مطابقة حاليا'));filtered.slice(0,visible).forEach(s=>{const card=el('article','card'),top=el('div','card-top'),info=el('div');info.append(el('h3','',s.name),el('p','',s.description));const btn=el('button','detail','التفاصيل');btn.type='button';top.append(info,btn);card.append(top);const extra=el('div','extra');extra.hidden=true;extra.append(el('strong','','المخرج النهائي'),el('div','',s.deliverable),el('strong','','الأدوات'));const tools=el('div','tools');s.tools.forEach(t=>{const a=el('a','',t.name);a.href=t.url;a.target='_blank';a.rel='noopener noreferrer';tools.append(a)});extra.append(tools);card.append(extra);btn.addEventListener('click',()=>{extra.hidden=!extra.hidden;btn.textContent=extra.hidden?'التفاصيل':'إغلاق'});cards.append(card)});$('more').hidden=visible>=filtered.length}
$('levels').addEventListener('keydown',()=>{});$('search').addEventListener('click',()=>{filtered=services.filter(s=>s.level<=level&&($('category').value==='all'||s.category===$('category').value)).sort((a,b)=>b.level-a.level||a.name.localeCompare(b.name,'ar'));visible=3;$('results').hidden=false;render()});$('more').addEventListener('click',()=>{visible+=6;render()});
fetch('./data/services.json').then(r=>{if(!r.ok)throw Error('data');return r.json()}).then(x=>{services=x}).catch(()=>{$('search').disabled=true;$('search').textContent='تعذر تحميل البيانات'});
</script></body></html>
